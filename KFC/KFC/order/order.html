<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Order - KFC Philippines</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Work+Sans:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <iframe class="background-page" src="../home_page/index.html" title="KFC home page" tabindex="-1"></iframe>

    <div class="overlay">
      <div class="popup">
        <div class="popup-header">
          <h2>Select ordering method</h2>
          <a href="../home_page/index.html" class="close" title="Close"><i class="fa-solid fa-xmark"></i></a>
        </div>

        <a href="delivery.html" class="order-type">
          <img src="https://staging.tictuk.com/defaultThemes/brands/kfc/assets/images/orderTypes/delivery.png" alt="Delivery" />
          <h1>Delivery</h1>
        </a>

        <a href="./location.html" class="order-type">
          <img src="https://cdn.tictuk.com/04d917c0-7bcd-6ced-acad-3e4db2bcbfd5/theme/assets/images/orderTypes/pickup.png" alt="Pickup or dine-in" />
          <h1>Pickup / Dine-in</h1>
        </a>

        <div class="stripes"><span></span><span></span><span></span></div>
      </div>
    </div>
  </body>
</html>
